[project]
name = "reforma-report"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "redderi", email = "vrudko22@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.6.1",
    "aiohttp>=3.13.3",
    "asyncio>=4.0.0",
    "asyncpg>=0.31.0",
    "dotenv>=0.9.9",
    "elasticsearch>=9.3.0",
    "fastapi[standart]>=0.132.0",
    "psycopg2>=2.9.11",
    "python-jose>=3.5.0",
    "sqlalchemy>=2.0.46",
    "uvicorn>=0.41.0",
]

[project.scripts]
reforma-report = "reforma_report:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"
