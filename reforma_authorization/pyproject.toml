[project.scripts]
reforma-authorization = "reforma_authorization:main"

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.8.4,<0.9.0"]

[dependency-groups]
dev = [
  "ruff>=0.14.14",
]
