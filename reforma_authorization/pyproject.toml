[project]
name = "reforma-authorization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "redderi", email = "vrudko22@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.5.8",
    "bcrypt==4.0.1",
    "fastapi>=0.128.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.11",
    "pydantic[email]>=2.12.5",
    "python-dotenv>=1.2.1",
    "python-jose>=3.5.0",
    "sqlalchemy>=2.0.45",
    "uvicorn>=0.40.0",
]

[project.scripts]
reforma-authorization = "reforma_authorization:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.14.14",
]
